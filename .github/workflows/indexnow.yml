name: IndexNow URL submission

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "worker/**"
      - "server/**"
      - "vite.config.ts"
      - "package.json"
      - "wrangler.toml"
      - "scripts/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Wait for production deployment and submit sitemap URLs
        run: node scripts/submit-indexnow.mjs
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
